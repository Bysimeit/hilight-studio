name: Build app

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'internal-docs/**'
      - '.idea/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      official:
        description: 'Publish an official versioned release (otherwise latest build)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: ./.github/actions/android-toolchain

      - name: Test, build, and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:build :app:lint

      - name: Build standalone helper
        run: ./scripts/build-helper.sh

      - name: Verify optimized privileged entry points
        run: |
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$release_apk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages "$release_apk" > "$RUNNER_TEMP/dex-packages.txt"
          grep -q 'com.hilight.core.AdbHelper' "$RUNNER_TEMP/dex-packages.txt"
          grep -q 'com.hilight.studio.HiLightUserService' "$RUNNER_TEMP/dex-packages.txt"

      - name: Keep the reports of a failed check
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  android:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: ./.github/actions/android-toolchain

      - id: version
        run: |
          value=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Decode and check the signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing or empty repository secrets:$missing" >&2
            echo "Add them under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "ANDROID_KEYSTORE decoded to an empty file, so it is not valid base64." >&2
            exit 1
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                 -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "The keystore exists but could not be opened with that password and alias." >&2
            echo "Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS." >&2
            exit 1
          fi

      - name: Build the signed release APK
        env:
          HILIGHT_STORE_FILE: ${{ runner.temp }}/release.jks
          HILIGHT_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HILIGHT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HILIGHT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()

      - name: Package the signed APK
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          signed=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$signed" ]; then
            echo "No signed APK. Gradle produced:" >&2
            ls app/build/outputs/apk/release/ >&2
            echo "Check the ANDROID_KEYSTORE* secrets." >&2
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$signed"

          cp "$signed" "HiLight-Studio-v$VERSION-experimental.apk"
          sha256sum "HiLight-Studio-v$VERSION-experimental.apk" > "HiLight-Studio-v$VERSION-experimental.apk.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android
          path: |
            HiLight-Studio-v*-experimental.apk
            HiLight-Studio-v*-experimental.apk.sha256
          if-no-files-found: error

  release:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.android.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          OFFICIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.official }}
          PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
        working-directory: dist
        run: |
          apk="HiLight-Studio-v$VERSION-experimental.apk"
          files=("$apk" "$apk.sha256")
          digest=$(cut -d' ' -f1 "$apk.sha256")
          notes="Signed with the HiLight Studio release certificate. Installing over a build signed by another identity needs one uninstall first.

          SHA-256 \`$digest\`"

          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"

          if [ "$OFFICIAL" = "true" ]; then
            gh release create "v$VERSION-experimental" "${files[@]}" \
              --title "HiLight Studio $VERSION (experimental)" \
              --notes "$notes" --generate-notes $flags
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest "${files[@]}" \
              --title "Latest build ($VERSION, build $RUN_NUMBER)" \
              --notes "$notes" --prerelease
          fi
